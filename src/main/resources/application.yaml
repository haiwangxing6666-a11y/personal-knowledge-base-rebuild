spring:
  application:
    name: personal-knowledge-base

  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/personal_knowledge_base}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update

  ai:
    model:
      embedding: openai
    openai:
      api-key: ${SILICONFLOW_API_KEY:replace-with-your-api-key}
      base-url: ${SILICONFLOW_BASE_URL:https://api.siliconflow.cn/v1}
      embedding:
        model: ${EMBEDDING_MODEL:BAAI/bge-m3}
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        index-type: HNSW
        distance-type: COSINE_DISTANCE

app:
  chunk:
    max-chars: 500
    overlap-chars: 50
